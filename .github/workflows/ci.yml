name: CI and Publish Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. sha-<full>); leave empty for this commit"
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.deniscoglobalagroltd.com
          NEXT_PUBLIC_WEB_URL: https://deniscoglobalagroltd.com
        run: npm run build

  publish:
    name: Build and push GHCR image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/dev-folabi/denisco-admin
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.deniscoglobalagroltd.com
            NEXT_PUBLIC_WEB_URL=https://deniscoglobalagroltd.com

  deploy:
    name: Deploy to the VPS
    needs: publish
    # Runs for a push to main and for a manual dispatch (which takes an
    # optional image tag, for rolling back to a previous release). The VPS
    # itself must already be provisioned; DEPLOY_ENABLED is the switch.
    if: |
      always() &&
      needs.publish.result == 'success' &&
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-denisco-admin
      cancel-in-progress: false

    steps:
      - name: Deploy admin
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          TAG: ${{ github.event.inputs.tag || format('sha-{0}', github.sha) }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "VPS_SSH_KEY secret and VPS_HOST variable are required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=accept-new "deploy@$VPS_HOST" \
            "cd /opt/denisco/denisco_backend/deployments && ./deploy.sh admin '$TAG'"